max_images_per_short: 4
max_video_duration_sec: 90   # allow clearer multi-story narration
target_duration_sec: 70

web:
  host: 127.0.0.1
  port: 8081

video:
  width: 1080
  height: 1920
  target_duration_sec: 70
  fps: 24
  format: mp4
  # auto = use NVIDIA NVENC when available, else libx264
  codec: auto

tts:
  provider: edge-tts
  rate: "-8%"
  segment_pause_sec: 0.4
  voice_map:
    en: en-US-JennyNeural

script:
  provider: chain   # chain | groq (alias) | template
  model: llama-3.1-8b-instant   # used only when LLM_PROVIDER/LLM_CHAIN unset
  style: natural human news Shorts host speaking in complete sentences; explain each story clearly; do not re-read on-screen headlines; never name outlets or say website domains/.com
  intro_template: "Here are today's top {n} {section} stories."
  outro_template: "Thanks for watching. Follow for more English news Shorts."

images:
  providers: [news_og, wikimedia, openverse]
  llm_keywords: true
  max_queries_per_story: 3

# Same YouTube channel as trends-video-pipeline — use shared secrets/
youtube:
  enabled: true
  category_id: "25"
  privacy: public
  made_for_kids: false
