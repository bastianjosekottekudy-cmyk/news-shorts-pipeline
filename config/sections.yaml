# Add or remove sections here. Restart the app after changes.
#
# Fields:
#   code           - short id used in output paths and API (e.g. tech)
#   name           - Display name
#   google_topic   - Google News topic (TECHNOLOGY, ENTERTAINMENT, WORLD, BUSINESS, …)
#   search_query   - optional; if set, uses RSS search instead of topic
#   rss_url        - optional; full custom RSS URL overrides topic/search
#   news_count     - how many headlines to fetch into the section Short (default 5)
#   language       - narration language (maps to TTS voice in pipeline.yaml)
#   region         - Google News gl / ceid region (e.g. US)
#   timezone       - IANA timezone for daily 10pm schedule
#   youtube_tags   - tags appended on upload
#
# Always produces exactly 1 Short per section covering all fetched headlines.

sections:
  - code: tech
    name: Technology
    google_topic: TECHNOLOGY
    news_count: 5
    language: en
    region: US
    timezone: America/New_York
    youtube_tags: [shorts, tech, news, technology]

  - code: entertainment
    name: Entertainment
    google_topic: ENTERTAINMENT
    news_count: 5
    language: en
    region: US
    timezone: America/New_York
    youtube_tags: [shorts, entertainment, news]

  - code: global
    name: Global News
    google_topic: WORLD
    news_count: 5
    language: en
    region: US
    timezone: America/New_York
    youtube_tags: [shorts, world, news, global]

  - code: business
    name: Business
    google_topic: BUSINESS
    news_count: 5
    language: en
    region: US
    timezone: America/New_York
    youtube_tags: [shorts, business, news]
