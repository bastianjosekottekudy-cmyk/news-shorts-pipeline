  - code: us
    name: US
    google_topic: NATION
    news_count: 5
    language: en
    region: US
    timezone: Asia/Kolkata
    youtube_tags: [shorts, us, america, news]

  - code: uk
    name: UK
    google_topic: NATION
    news_count: 5
    language: en
    region: GB
    timezone: Asia/Kolkata
    youtube_tags: [shorts, uk, britain, news]

  - code: cyprus
    name: Cyprus
