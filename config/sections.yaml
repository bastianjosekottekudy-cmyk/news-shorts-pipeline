# Add or remove sections here. Restart the app after changes.
#
# Fields:
#   code           - short id used in output paths and API (e.g. tech)
#   name           - Display name
#   google_topic   - Google News topic (TECHNOLOGY, ENTERTAINMENT, WORLD, BUSINESS, NATION, …)
#   search_query   - optional; if set, uses RSS search instead of topic
#   rss_url        - optional; full custom RSS URL overrides topic/search
#   news_count     - how many headlines to fetch into the section Short (default 5)
#   language       - always English (en) for narration + Google News hl
#   region         - Google News gl / ceid region (e.g. US, GB, IN, CY)
#   timezone       - IANA timezone for run dates (schedule is fixed to Asia/Kolkata)
#   youtube_tags   - tags appended on upload
#
# Always produces exactly 1 Short per section covering all fetched headlines.
# All sections run daily at 10:00 PM India Standard Time (Asia/Kolkata).

sections:
  - code: tech
    name: Technology
    google_topic: TECHNOLOGY
    news_count: 5
    language: en
    region: US
    timezone: Asia/Kolkata
    youtube_tags: [shorts, tech, news, technology]

  - code: entertainment
    name: Entertainment
    google_topic: ENTERTAINMENT
    news_count: 5
    language: en
    region: US
    timezone: Asia/Kolkata
    youtube_tags: [shorts, entertainment, news]

  - code: global
    name: Global News
    google_topic: WORLD
    news_count: 5
    language: en
    region: US
    timezone: Asia/Kolkata
    youtube_tags: [shorts, world, news, global]

  - code: business
